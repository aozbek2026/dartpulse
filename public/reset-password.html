<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Şifre Sıfırlama — Dart Core Pro</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0b0d14; }
  .card { background: #12152a; border: 1px solid #1e2336; border-radius: 18px; padding: 2.5rem 2rem; max-width: 420px; width: 90%; }
  h2 { margin: 0 0 0.25rem; font-size: 1.4rem; text-align: center; }
  .sub { color: #8892b0; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
  label { display: block; color: #8892b0; font-size: 0.85rem; margin-bottom: 0.35rem; }
  input { width: 100%; box-sizing: border-box; background: #1a1e30; border: 1px solid #2a2e45; border-radius: 10px; padding: 0.75rem 1rem; color: #fff; font-size: 1rem; margin-bottom: 1rem; }
  input:focus { outline: none; border-color: #ff3860; }
  .btn { width: 100%; background: linear-gradient(135deg,#ff3860,#c0392b); color: #fff; border: none; border-radius: 10px; padding: 0.85rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .error { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
  .success { text-align: center; display: none; }
  .success .icon { font-size: 3rem; margin-bottom: 1rem; }
  a.back { display: block; text-align: center; margin-top: 1rem; color: #8892b0; font-size: 0.85rem; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div id="form-view">
    <h2>🔑 Şifre Sıfırla</h2>
    <p class="sub">Yeni şifrenizi girin</p>
    <div class="error" id="err"></div>
    <label>Yeni Şifre</label>
    <input type="password" id="pw" placeholder="En az 6 karakter" />
    <label>Yeni Şifre (Tekrar)</label>
    <input type="password" id="pw2" placeholder="Şifreyi tekrar girin" />
    <button class="btn" onclick="submit()">Şifremi Güncelle</button>
    <a href="/login.html" class="back">← Giriş sayfasına dön</a>
  </div>
  <div class="success" id="success-view">
    <div class="icon">✅</div>
    <h2>Şifre Güncellendi!</h2>
    <p class="sub">Yeni şifrenizle giriş yapabilirsiniz.</p>
    <a href="/login.html" class="btn" style="display:inline-block;text-decoration:none;text-align:center;margin-top:1rem;">Giriş Yap</a>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');

async function submit() {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';

  if (pw.length < 6) { showErr('Şifre en az 6 karakter olmalı'); return; }
  if (pw !== pw2) { showErr('Şifreler eşleşmiyor'); return; }
  if (!token) { showErr('Geçersiz link'); return; }

  const r = await fetch('/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password: pw })
  });
  const d = await r.json();
  if (r.ok) {
    document.getElementById('form-view').style.display = 'none';
    document.getElementById('success-view').style.display = 'block';
  } else {
    showErr(d.error || 'Bir hata oluştu');
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
