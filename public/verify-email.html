<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-posta Doğrulama — Dart Core Pro</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0b0d14; }
  .card { background: #12152a; border: 1px solid #1e2336; border-radius: 18px; padding: 2.5rem 2rem; max-width: 420px; width: 90%; text-align: center; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h2 { margin: 0 0 0.75rem; font-size: 1.4rem; }
  p { color: #8892b0; margin: 0 0 1.5rem; line-height: 1.6; }
  .btn { display: inline-block; background: #ff3860; color: #fff; padding: 0.75rem 2rem; border-radius: 10px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; font-size: 1rem; }
  .btn.secondary { background: transparent; border: 1px solid #333; color: #8892b0; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <h2 id="title">Doğrulanıyor...</h2>
  <p id="msg">Lütfen bekleyin.</p>
  <div id="actions"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

async function verify() {
  if (!token) {
    show('❌', 'Geçersiz Link', 'Doğrulama token\'ı bulunamadı.', true);
    return;
  }
  try {
    const r = await fetch(`/auth/verify-email?token=${encodeURIComponent(token)}`);
    const data = await r.json();
    if (r.ok) {
      show('✅', 'E-posta Doğrulandı!', 'Hesabınız aktif. Artık giriş yapabilirsiniz.', false);
    } else {
      show('❌', 'Geçersiz Link', data.error || 'Bu link daha önce kullanılmış veya süresi dolmuş.', true);
    }
  } catch {
    show('❌', 'Bağlantı Hatası', 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.', true);
  }
}

function show(icon, title, msg, showResend) {
  document.getElementById('icon').textContent = icon;
  document.getElementById('title').textContent = title;
  document.getElementById('msg').textContent = msg;
  document.getElementById('actions').innerHTML = `
    <a href="/login.html" class="btn" style="margin-right:0.5rem;">Giriş Yap</a>
    ${showResend ? `<button class="btn secondary" onclick="resend()">Yeniden Gönder</button>` : ''}
  `;
}

async function resend() {
  const r = await fetch('/auth/resend-verify', { method: 'POST' });
  const d = await r.json();
  alert(d.message || 'Gönderildi.');
}

verify();
</script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
