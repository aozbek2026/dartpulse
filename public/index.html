<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dart Pulse</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .spinner { width: 2rem; height: 2rem; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
<script>
fetch('/auth/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(data => {
    window.location.replace(data.user ? '/organizer.html' : '/login.html');
  })
  .catch(() => {
    window.location.replace('/login.html');
  });
</script>
</body>
</html>
