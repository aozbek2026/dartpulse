<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Hızlı Skor — Dart Core Pro</title>
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dart Skor" />
<meta name="theme-color" content="#0b0d14" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  html, body { height: 100dvh; height: 100svh; overflow: hidden; overscroll-behavior: none; padding: 0; margin: 0; }
  body { display: flex; flex-direction: column; touch-action: pan-x; }

  #setup-panel { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 560px; margin: 2rem auto; width: calc(100% - 2rem); box-sizing: border-box; max-height: calc(100dvh - 4rem); overflow-y: auto; }
  #setup-panel h2 { font-size: 1.4rem; margin: 0; }
  #setup-panel .modes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.5rem;
  }
  #setup-panel .mode-btn {
    background: var(--bg-2);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 0.6rem;
    cursor: pointer;
    text-align: center;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  #setup-panel .mode-btn:hover { border-color: var(--accent-2); }
  #setup-panel .mode-btn.on { border-color: var(--accent); background: var(--surface-2); }
  #setup-panel .mode-btn .nm { font-weight: 700; font-size: 0.95rem; }
  #setup-panel .mode-btn .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.15rem; }
  #setup-panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  #setup-panel input, #setup-panel select { width: 100%; box-sizing: border-box; }
  #setup-panel label { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 0.25rem; display: block; }
  #setup-panel .toggle-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; }
  #setup-panel .toggle-row input { width: auto; }

  #game-panel { display: none; flex-direction: column; position: fixed; inset: 0; z-index: 10; background: #0b0d14; overflow: hidden; }

  #result-panel { display: none; flex-direction: column; align-items: stretch; justify-content: flex-start; overflow-y: auto; flex: 1; padding: 0; }
  #result-panel .winner-name { font-size: clamp(1.6rem, 6vmin, 2.8rem); font-weight: 900; color: var(--accent); }

  /* Onay modali */
  .sc-confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
  .sc-confirm-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 360px; width: 100%; text-align: center; }
  .sc-confirm-box p { margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.5; }
  .sc-confirm-box .sc-confirm-btns { display: flex; gap: 0.75rem; justify-content: center; }
</style>
</head>
<body>
<div id="scorer-root" style="display:flex;flex-direction:column;flex:1;height:100dvh;overflow:hidden;">

  <!-- Setup -->
  <div id="setup-panel">
    <h2>🎯 Hızlı Skor</h2>
    <p style="color:var(--text-dim);font-size:0.88rem;margin:-0.5rem 0 0.5rem;">Tablet ya da hesap gerekmez.</p>

    <div>
      <label>Oyun modu</label>
      <div class="modes" id="mode-group">
        <button class="mode-btn on" data-mode="501"><div class="nm">501</div><div class="sub">Standart X01</div></button>
        <button class="mode-btn" data-mode="701"><div class="nm">701</div><div class="sub">Uzun X01</div></button>
        <button class="mode-btn" data-mode="1001"><div class="nm">1001</div><div class="sub">Maraton</div></button>
        <button class="mode-btn" data-mode="cricket"><div class="nm">Cricket</div><div class="sub">15-20 + Bull</div></button>
        <button class="mode-btn" data-mode="cricket_fb_cezali"><div class="nm">FB Cezalı</div><div class="sub">Tam tahta</div></button>
        <button class="mode-btn" data-mode="cricket_fb_karambol"><div class="nm">Karambol</div><div class="sub">Puan yok</div></button>
      </div>
    </div>

    <div class="row">
      <div>
        <label>1. Oyuncu</label>
        <input id="s-p1" type="text" placeholder="Oyuncu 1" value="Oyuncu 1" />
      </div>
      <div>
        <label>2. Oyuncu</label>
        <input id="s-p2" type="text" placeholder="Oyuncu 2" value="Oyuncu 2" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Kazanmak için leg</label>
        <input id="s-legs" type="number" min="1" max="11" value="2" />
      </div>
      <div>
        <label>Başlayan oyuncu</label>
        <select id="s-starter">
          <option value="1">Oyuncu 1</option>
          <option value="2">Oyuncu 2</option>
        </select>
      </div>
    </div>

    <div id="fb-options" hidden>
      <div class="toggle-row">
        <input id="s-include-low" type="checkbox" checked />
        <label for="s-include-low" style="margin:0;color:var(--text);">10 ve 11 segmentleri dahil</label>
      </div>
    </div>

    <button class="btn primary" onclick="startGame()" style="margin-top:0.5rem;">Oyuna Başla</button>
    <a href="/" style="text-align:center;color:var(--text-dim);font-size:0.85rem;">← Ana sayfa</a>
  </div>

  <div id="game-panel"></div>

  <div id="result-panel"></div>

</div>

<script>
// =====================================================================
// HIZLI SKOR — local-only scoring app
// NOT: Cricket/FB/Karambol render kodu ve X01 atış flash modalı (showScoreFlash)
// board.js'ten kopyalanmıştır. Board UI/mantığı değişirse BURASI da güncellenmelidir.
// =====================================================================

// ---- Mode selector ----
let selectedMode = '501';
document.querySelectorAll('#mode-group .mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    selectedMode = b.dataset.mode;
    document.querySelectorAll('#mode-group .mode-btn').forEach(x => x.classList.toggle('on', x === b));
    const isFB = (selectedMode === 'cricket_fb_cezali' || selectedMode === 'cricket_fb_karambol');
    document.getElementById('fb-options').hidden = !isFB;
  });
});

// =====================================================================
// STATE
// =====================================================================
const root = document.getElementById('game-panel');

// Game state (local)
let G = null;

// Adapter — board.js render fonksiyonları bunları okur:
let currentMatch = null;
let currentBoard = { name: 'Hızlı Skor' };
const isReadonly = false;
let cricketDarts = [];
let fbDarts = [];
let karambolDarts = [];
let fbMetaMode = null;
let fbMetaScore = 0;
let currentInput = '';
let submitLocked = false;

// =====================================================================
// HELPERS
// =====================================================================
function entryLabel(entry) {
  if (!entry) return '—';
  return entry.player1?.name || '?';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, ms = 2000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d2e;color:#fff;padding:0.65rem 1.2rem;border-radius:8px;border:1px solid var(--border);z-index:99999;font-size:0.9rem;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function buildMatch() {
  if (!G) return null;
  return {
    game_mode: G.mode,
    current_turn: G.currentTurn,
    current_leg: G.currentLeg,
    p1_legs: G.legs[1],
    p2_legs: G.legs[2],
    p1_leg_score: G.remaining[1],
    p2_leg_score: G.remaining[2],
    cricket_state_json: G.cricket_state ? JSON.stringify(G.cricket_state) : null,
    cricket_undo_json: G.undoSnapshot ? JSON.stringify(G.undoSnapshot) : null,
    entry1: { player1: { name: G.players[1] } },
    entry2: { player1: { name: G.players[2] } },
    round_label: '',
    sets_to_win: 1,
    p1_sets: 0, p2_sets: 0,
    stats: [
      { player_slot: 1, total: G.totalScore[1], darts: G.darts[1] },
      { player_slot: 2, total: G.totalScore[2], darts: G.darts[2] },
    ],
  };
}

function refresh() {
  currentMatch = buildMatch();
  renderMatch();
}

// =====================================================================
// START GAME
// =====================================================================
function startGame() {
  const mode = selectedMode;
  const p1 = (document.getElementById('s-p1').value || 'Oyuncu 1').trim();
  const p2 = (document.getElementById('s-p2').value || 'Oyuncu 2').trim();
  const legsToWin = Math.max(1, +document.getElementById('s-legs').value || 2);
  const starter = +document.getElementById('s-starter').value;
  const includeLow = document.getElementById('s-include-low').checked;
  const startScore = { '501': 501, '701': 701, '1001': 1001 }[mode] || 0;

  G = {
    mode,
    players: [null, p1, p2],
    legsToWin,
    starter,
    currentLeg: 1,
    currentTurn: starter,
    legs: [0, 0, 0],
    remaining: [0, startScore, startScore],
    totalScore: [0, 0, 0],
    darts: [0, 0, 0],
    turns: [0, 0, 0],
    history: [],
    cricket_state: initCricketState(mode, includeLow),
    finished: false,
    winnerSlot: null,
    undoSnapshot: null,
    includeLow,
  };
  cricketDarts = []; fbDarts = []; karambolDarts = [];
  fbMetaMode = null; fbMetaScore = 0;
  currentInput = '';

  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
  root.style.display = 'flex';
  refresh();
}

function resetGame() {
  G = null; currentMatch = null;
  cricketDarts = []; fbDarts = []; karambolDarts = [];
  fbMetaMode = null; fbMetaScore = 0;
  currentInput = '';
  document.getElementById('setup-panel').style.display = 'flex';
  root.style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
}

// =====================================================================
// CRICKET STATE INIT
// =====================================================================
const CRICKET_NUMBERS = [20, 19, 18, 17, 16, 15, 25];
const FB_NUMBERS = [20,19,18,17,16,15,14,13,12,25];
const FB_NUMBERS_LOW = [11,10];
const FB_SPECIALS = ['D','T','H'];

function fbTargetsList(includeLow) {
  return [...(includeLow ? [...FB_NUMBERS,...FB_NUMBERS_LOW] : FB_NUMBERS), ...FB_SPECIALS];
}

function initCricketState(mode, includeLow) {
  if (mode === 'cricket') {
    const marks = {};
    for (const n of CRICKET_NUMBERS) marks[n] = { p1: 0, p2: 0 };
    return { marks, p1_score: 0, p2_score: 0 };
  }
  if (mode === 'cricket_fb_cezali') {
    const marks = {};
    for (const t of fbTargetsList(includeLow)) marks[String(t)] = { p1: 0, p2: 0 };
    return { marks, p1_score: 0, p2_score: 0, include_low: !!includeLow };
  }
  if (mode === 'cricket_fb_karambol') {
    const marks = {};
    for (const t of fbTargetsList(includeLow)) marks[String(t)] = { p1: 0, p2: 0 };
    return { marks, include_low: !!includeLow };
  }
  return null;
}

// =====================================================================
// CRICKET RENDER (board.js'ten kopyalandı, currentMatch'i kullanır)
// =====================================================================
function cricketMarksHtml(count, active) {
  if (count <= 0) return '<span class="cr-mark-empty">·</span>';
  if (count === 1) return `<span class="cr-mark${active ? ' cr-mark-act' : ''}">/</span>`;
  if (count === 2) return `<span class="cr-mark${active ? ' cr-mark-act' : ''}">╳</span>`;
  return `<span class="cr-mark cr-mark-closed">⊗</span>`;
}
function cricketMarkSym(count) {
  if (count <= 0) return { sym: '·', cls: 'cr-m0' };
  if (count === 1) return { sym: '/', cls: 'cr-m1' };
  if (count === 2) return { sym: 'X', cls: 'cr-m2' };
  return { sym: 'O', cls: 'cr-m3' };
}
function cricketPendingForTarget(target) {
  let extra = 0;
  for (const d of cricketDarts) if (d.target === target && d.mult > 0) extra += d.mult;
  return extra;
}
const FB_TARGETS_ALL = ['20','19','18','17','16','15','14','13','12','11','10','D','T','25','H'];
const FB_TARGET_LABEL = { '25': 'BULL', 'D': 'D', 'T': 'T', 'H': 'H' };
function fbTargetLabel(t) { return FB_TARGET_LABEL[t] || t; }
function fbIsNumberTarget(t) { return !isNaN(parseInt(t)); }
function fbIsMetaTarget(t) { return t === 'D' || t === 'T' || t === 'H'; }
function fbPendingForTarget(target) {
  let extra = 0;
  for (const d of fbDarts) if (d.target === target && d.mult > 0) extra += d.mult;
  return extra;
}
function karambolPendingForTarget(target) {
  let extra = 0;
  for (const d of karambolDarts) if (d.target === target && d.mult > 0) extra += d.mult;
  return extra;
}

function renderMatch() {
  const m = currentMatch;
  if (!m) return;
  if (m.game_mode === 'cricket') return renderCricketMatch(m);
  if (m.game_mode === 'cricket_fb_cezali') return renderFBCezaliMatch(m);
  if (m.game_mode === 'cricket_fb_karambol') return renderKarambolMatch(m);
  return renderX01Match(m);
}

function renderCricketMatch(m) {
  const e1 = entryLabel(m.entry1);
  const e2 = entryLabel(m.entry2);
  const isTurn1 = m.current_turn === 1;
  const boardName = currentBoard.name;
  const headerRight = `<button class="btn secondary" onclick="resetGame()">Yeniden</button>`;

  let state;
  try { state = m.cricket_state_json ? JSON.parse(m.cricket_state_json) : null; } catch { state = null; }
  if (!state) state = { marks: Object.fromEntries(CRICKET_NUMBERS.map(n => [n, {p1:0,p2:0}])), p1_score:0, p2_score:0 };

  const rows = CRICKET_NUMBERS.map(n => {
    const p1m = state.marks[n]?.p1 || 0;
    const p2m = state.marks[n]?.p2 || 0;
    const pendingForMe = cricketPendingForTarget(n);
    const leftCount  = p1m + (isTurn1 ? pendingForMe : 0);
    const rightCount = p2m + (isTurn1 ? 0 : pendingForMe);
    const lSym = cricketMarkSym(leftCount);
    const rSym = cricketMarkSym(rightCount);
    const bothClosed = leftCount >= 3 && rightCount >= 3;
    const numLabel = n === 25 ? 'BULL' : n;
    const isBull = (n === 25);
    const dBtn = isBull
      ? `<button class="cr-tap-dbull" onclick="cricketDart(25, 2)">D-BULL</button>`
      : `<button class="cr-tap-d" onclick="cricketDart(${n}, 2)">D</button>`;
    const tBtn = isBull
      ? `<div></div>`
      : `<button class="cr-tap-t" onclick="cricketDart(${n}, 3)">T</button>`;
    return `
      <div class="cr-target-row${bothClosed ? ' cr-target-done' : ''}">
        <div class="cr-marks-l ${lSym.cls}${isTurn1 ? ' cr-active' : ''}">${lSym.sym}</div>
        ${dBtn}
        <button class="cr-tap-num" onclick="cricketDart(${n}, 1)">${numLabel}</button>
        ${tBtn}
        <div class="cr-marks-r ${rSym.cls}${!isTurn1 ? ' cr-active' : ''}">${rSym.sym}</div>
      </div>`;
  }).join('');

  const dotsHtml = [0,1,2].map(i => {
    const d = cricketDarts[i];
    if (!d) return `<div class="cr-dot"></div>`;
    if (d.target == null) return `<div class="cr-dot cr-dot-miss">×</div>`;
    const pre = d.mult === 2 ? 'D' : d.mult === 3 ? 'T' : '';
    const lbl = d.target === 25 ? (d.mult === 2 ? 'DB' : 'B') : `${pre}${d.target}`;
    return `<div class="cr-dot cr-dot-hit">${lbl}</div>`;
  }).join('');

  const undoEnabled = cricketDarts.length > 0 || !!G.undoSnapshot;
  const enterEnabled = cricketDarts.length > 0;

  root.innerHTML = `
    <div class="board-header">
      <div>
        <div class="board-name">${boardName}</div>
        <div class="match-info">${m.game_mode.toUpperCase()} · Bo${G.legsToWin*2-1} · Leg ${m.current_leg} · Sıra: <strong>${isTurn1 ? e1 : e2}</strong></div>
      </div>
      ${headerRight}
    </div>
    <div class="cr-wrap">
      <div class="cr-scores">
        <div class="cr-score-col${isTurn1 ? ' cr-flip-active' : ''}">
          <div class="cr-name">${e1}</div>
          <div class="cr-pts">${state.p1_score || 0}</div>
          <div class="cr-legs">${m.p1_legs || 0} leg</div>
        </div>
        <div class="cr-score-col${!isTurn1 ? ' cr-flip-active' : ''}">
          <div class="cr-name">${e2}</div>
          <div class="cr-pts">${state.p2_score || 0}</div>
          <div class="cr-legs">${m.p2_legs || 0} leg</div>
        </div>
      </div>
      <div class="cr-targets">${rows}</div>
      <div class="cr-bottom-bar">
        <button class="cr-undo-btn" onclick="cricketUndoDart()" ${undoEnabled ? '' : 'disabled'}>← GERİ</button>
        <div class="cr-dots">${dotsHtml}</div>
        <button class="cr-miss-btn" onclick="submitCricketDarts()" ${enterEnabled ? '' : 'disabled'}>Enter</button>
      </div>
    </div>
  `;
}

function renderFBCezaliMatch(m) {
  const e1 = entryLabel(m.entry1);
  const e2 = entryLabel(m.entry2);
  const isTurn1 = m.current_turn === 1;
  const boardName = currentBoard.name;
  const headerRight = `<button class="btn secondary" onclick="resetGame()">Yeniden</button>`;

  let state;
  try { state = m.cricket_state_json ? JSON.parse(m.cricket_state_json) : null; } catch { state = null; }
  if (!state) state = { marks: {}, p1_score: 0, p2_score: 0, include_low: true };

  const activeTargets = FB_TARGETS_ALL.filter(t => {
    if ((t === '10' || t === '11') && !state.include_low) return false;
    return true;
  });

  const rows = activeTargets.map(t => {
    const p1m = state.marks[t]?.p1 || 0;
    const p2m = state.marks[t]?.p2 || 0;
    const pendingForMe = fbPendingForTarget(t);
    const leftCount = Math.min(3, p1m + (isTurn1 ? pendingForMe : 0));
    const rightCount = Math.min(3, p2m + (isTurn1 ? 0 : pendingForMe));
    const lSym = cricketMarkSym(leftCount);
    const rSym = cricketMarkSym(rightCount);
    const bothClosed = leftCount >= 3 && rightCount >= 3;
    const label = fbTargetLabel(t);
    const isBull = (t === '25');
    const isMeta = fbIsMetaTarget(t);

    if (isMeta) {
      const modeOn = (fbMetaMode === t);
      return `
        <div class="cr-target-row cr-target-meta${bothClosed ? ' cr-target-done' : ''}">
          <div class="cr-marks-l ${lSym.cls}${isTurn1 ? ' cr-active' : ''}">${lSym.sym}</div>
          <button class="cr-tap-num cr-tap-meta${modeOn ? ' cr-tap-meta-active' : ''}" onclick="fbMetaTap('${t}')">${label}${modeOn ? ' ✓' : ''}</button>
          <div class="cr-marks-r ${rSym.cls}${!isTurn1 ? ' cr-active' : ''}">${rSym.sym}</div>
        </div>`;
    }
    if (isBull) {
      return `
        <div class="cr-target-row${bothClosed ? ' cr-target-done' : ''}">
          <div class="cr-marks-l ${lSym.cls}${isTurn1 ? ' cr-active' : ''}">${lSym.sym}</div>
          <button class="cr-tap-dbull" onclick="fbDart('25', 2)">D-BULL</button>
          <button class="cr-tap-num" onclick="fbDart('25', 1)">${label}</button>
          <div></div>
          <div class="cr-marks-r ${rSym.cls}${!isTurn1 ? ' cr-active' : ''}">${rSym.sym}</div>
        </div>`;
    }
    return `
      <div class="cr-target-row${bothClosed ? ' cr-target-done' : ''}">
        <div class="cr-marks-l ${lSym.cls}${isTurn1 ? ' cr-active' : ''}">${lSym.sym}</div>
        <button class="cr-tap-d" onclick="fbDart('${t}', 2)">D</button>
        <button class="cr-tap-num" onclick="fbDart('${t}', 1)">${label}</button>
        <button class="cr-tap-t" onclick="fbDart('${t}', 3)">T</button>
        <div class="cr-marks-r ${rSym.cls}${!isTurn1 ? ' cr-active' : ''}">${rSym.sym}</div>
      </div>`;
  }).join('');

  const dotsHtml = [0,1,2].map(i => {
    const d = fbDarts[i];
    if (!d) return `<div class="cr-dot"></div>`;
    if (d.target == null) return `<div class="cr-dot cr-dot-miss">×</div>`;
    const pre = d.mult === 2 ? 'D' : d.mult === 3 ? 'T' : '';
    const tLabel = d.target === '25' ? (d.mult === 2 ? 'DB' : 'B') : d.target;
    return `<div class="cr-dot cr-dot-hit">${pre}${tLabel}</div>`;
  }).join('');

  const modeBar = fbMetaMode
    ? `<div class="cr-mode-bar">
         <span class="cr-mode-label">${fbMetaMode} CEZA</span>
         <span class="cr-mode-tip">— atışlarını tuşla</span>
         <span class="cr-mode-score">${fbMetaScore}</span>
       </div>`
    : '';

  const undoEnabled = fbDarts.length > 0 || !!G.undoSnapshot;
  const enterEnabled = fbDarts.length > 0;

  root.innerHTML = `
    <div class="board-header">
      <div>
        <div class="board-name">${boardName}</div>
        <div class="match-info">FB Cezalı · Bo${G.legsToWin*2-1} · Leg ${m.current_leg} · Sıra: <strong>${isTurn1 ? e1 : e2}</strong></div>
      </div>
      ${headerRight}
    </div>
    <div class="cr-wrap">
      <div class="cr-scores">
        <div class="cr-score-col${isTurn1 ? ' cr-flip-active' : ''}">
          <div class="cr-name">${e1}</div>
          <div class="cr-pts">${state.p1_score || 0}</div>
          <div class="cr-legs">${m.p1_legs || 0} leg</div>
        </div>
        <div class="cr-score-col${!isTurn1 ? ' cr-flip-active' : ''}">
          <div class="cr-name">${e2}</div>
          <div class="cr-pts">${state.p2_score || 0}</div>
          <div class="cr-legs">${m.p2_legs || 0} leg</div>

// =====================================================================
// CRICKET DART HANDLERS (board.js mirror) — local engine
// =====================================================================
function cricketDart(target, mult) {
  if (!G || G.finished) return;
  if (cricketDarts.length >= 3) return;
  cricketDarts.push({ target, mult });
  if (cricketDarts.length === 3) submitCricketDarts();
  else refresh();
}

function cricketUndoDart() {
  if (cricketDarts.length > 0) {
    cricketDarts.pop();
    refresh();
    return;
  }
  cricketConfirmAndUndoLastVisit();
}

async function submitCricketDarts() {
  if (!G || G.finished) return;
  const slot = G.currentTurn;
  const hits = {};
  for (const d of cricketDarts) {
    if (d.target == null || d.mult <= 0) continue;
    hits[d.target] = (hits[d.target] || 0) + d.mult;
  }
  cricketDarts = [];
  saveUndoSnapshot();
  applyCricketHits(slot, hits);
  postVisit(slot);
}

function applyCricketHits(slot, hits) {
  const pKey = `p${slot}`;
  const oppKey = slot === 1 ? 'p2' : 'p1';
  const st = G.cricket_state;
  let scored = 0;
  for (const [numStr, mc] of Object.entries(hits)) {
    const num = +numStr;
    if (!CRICKET_NUMBERS.includes(num) || !mc || mc < 1) continue;
    const myMarks = st.marks[num][pKey] || 0;
    const oppMarks = st.marks[num][oppKey] || 0;
    const newMarks = myMarks + mc;
    st.marks[num][pKey] = newMarks;
    if (oppMarks < 3) {
      const scoringMarks = Math.max(0, newMarks - 3) - Math.max(0, myMarks - 3);
      scored += scoringMarks * num;
    }
  }
  if (scored > 0) st[`${pKey}_score`] = (st[`${pKey}_score`] || 0) + scored;
  // Win check
  const allClosed = CRICKET_NUMBERS.every(n => (st.marks[n][pKey] || 0) >= 3);
  const myScore = st[`${pKey}_score`] || 0;
  const oppScore = st[`${oppKey}_score`] || 0;
  if (allClosed && myScore >= oppScore) {
    G.legs[slot]++;
    if (G.legs[slot] >= G.legsToWin) {
      G.finished = true; G.winnerSlot = slot;
    } else {
      G.currentLeg++;
      G.cricket_state = initCricketState('cricket', false);
      G.starter = G.starter === 1 ? 2 : 1;
      G.currentTurn = G.starter;
    }
  } else {
    G.currentTurn = slot === 1 ? 2 : 1;
  }
}

// =====================================================================
// FB CEZALI HANDLERS (board.js mirror)
// =====================================================================
function fbMetaTap(metaTarget) {
  if (!G || G.finished) return;
  if (fbMetaMode === metaTarget) {
    fbMetaMode = null; fbMetaScore = 0; fbDarts = [];
    refresh(); return;
  }
  const slot = G.currentTurn;
  const pKey = `p${slot}`;
  const oppKey = slot === 1 ? 'p2' : 'p1';
  const st = G.cricket_state;
  const myMeta = st.marks?.[metaTarget]?.[pKey] || 0;
  const oppMeta = st.marks?.[metaTarget]?.[oppKey] || 0;
  if (myMeta >= 3 && oppMeta < 3) {
    fbMetaMode = metaTarget; fbMetaScore = 0; fbDarts = [];
    refresh();
  } else {
    // H için visit başına 1 kez (3 ok = 1 H mark)
    if (metaTarget === 'H' && fbDarts.some(d => d.target === 'H')) {
      toast('H bu visit\'te zaten kaydedildi');
      return;
    }
    fbDart(metaTarget, 1);
  }
}

function fbDart(target, mult) {
  if (!G || G.finished) return;
  if (fbDarts.length >= 3) return;
  if (fbMetaMode) {
    if (target == null) {
      fbDarts.push({ target: null, mult: 0 });
    } else {
      const N = parseInt(target);
      if (isNaN(N)) { toast(`${fbMetaMode} ceza modu için sayıya bas`); return; }
      let valid = false, value = 0;
      if (fbMetaMode === 'D') { if (mult === 2) { valid = true; value = 2 * N; } }
      else if (fbMetaMode === 'T') { if (mult === 3) { valid = true; value = 3 * N; } }
      else if (fbMetaMode === 'H') {
        const fv = fbDarts.find(d => d.target != null && d.mult > 0);
        if (!fv) { valid = true; value = mult * N; }
        else if (fv.target === String(target)) { valid = true; value = mult * N; }
      }
      if (!valid) {
        if (fbMetaMode === 'D') toast('D ceza: D atışı gerekli');
        else if (fbMetaMode === 'T') toast('T ceza: T atışı gerekli');
        else if (fbMetaMode === 'H') toast('H ceza: aynı segment olmalı');
        return;
      }
      fbDarts.push({ target: String(target), mult });
      fbMetaScore += value;
    }
    if (fbDarts.length === 3) submitFBCezaliDarts();
    else refresh();
    return;
  }
  fbDarts.push({ target: target == null ? null : String(target), mult });
  if (fbDarts.length === 3) submitFBCezaliDarts();
  else refresh();
}

function fbUndoDart() {
  if (fbDarts.length > 0) {
    const last = fbDarts.pop();
    if (fbMetaMode && last && last.target != null && last.mult > 0) {
      const N = parseInt(last.target);
      if (!isNaN(N)) { fbMetaScore -= last.mult * N; if (fbMetaScore < 0) fbMetaScore = 0; }
    }
    refresh();
    return;
  }
  cricketConfirmAndUndoLastVisit();
}

async function submitFBCezaliDarts() {
  if (!G || G.finished) return;
  const slot = G.currentTurn;
  const pKey = `p${slot}`;
  const oppKey = slot === 1 ? 'p2' : 'p1';
  const st = G.cricket_state;

  let marksObj = {};
  let extraScore = 0;
  if (fbMetaMode) {
    extraScore = fbMetaScore;
  } else {
    const myDClosed = (st.marks?.['D']?.[pKey] || 0) >= 3;
    const oppDOpen  = (st.marks?.['D']?.[oppKey] || 0) <  3;
    const myTClosed = (st.marks?.['T']?.[pKey] || 0) >= 3;
    const oppTOpen  = (st.marks?.['T']?.[oppKey] || 0) <  3;
    const dFallback = myDClosed && oppDOpen;
    const tFallback = myTClosed && oppTOpen;
    for (const d of fbDarts) {
      if (d.target == null || d.mult <= 0) continue;
      marksObj[d.target] = (marksObj[d.target] || 0) + d.mult;
      const N = parseInt(d.target);
      if (isNaN(N)) continue;
      const oppMarks = st.marks?.[d.target]?.[oppKey] || 0;
      if (oppMarks < 3) continue;
      if (d.mult === 2 && dFallback) extraScore += 2 * N;
      else if (d.mult === 3 && tFallback) extraScore += 3 * N;
    }
  }
  fbDarts = []; const wasMode = fbMetaMode; fbMetaMode = null; fbMetaScore = 0;
  saveUndoSnapshot();

  // Apply marks + auto-score (number-path)
  const targets = fbTargetsList(G.includeLow);
  let autoScored = 0;
  for (const [t, count] of Object.entries(marksObj)) {
    if (!targets.map(String).includes(String(t))) continue;
    if (!st.marks[t]) st.marks[t] = { p1: 0, p2: 0 };
    const cur = st.marks[t][pKey] || 0;
    const oppM = st.marks[t][oppKey] || 0;
    const add = count || 0;
    const newM = cur + add;
    st.marks[t][pKey] = Math.min(3, newM);
    if (oppM < 3 && newM > 3) {
      const tval = isNaN(parseInt(t)) ? null : parseInt(t);
      if (tval !== null) {
        const extras = newM - Math.max(3, cur);
        autoScored += extras * tval;
      }
    }
  }
  if (autoScored > 0) st[`${pKey}_score`] = (st[`${pKey}_score`] || 0) + autoScored;
  if (extraScore > 0) st[`${pKey}_score`] = (st[`${pKey}_score`] || 0) + extraScore;

  // Win check
  const allClosed = targets.every(t => (st.marks[String(t)]?.[pKey] || 0) >= 3);
  const myScore = st[`${pKey}_score`] || 0;
  const oppScore = st[`${oppKey}_score`] || 0;
  if (allClosed && myScore >= oppScore) {
    G.legs[slot]++;
    if (G.legs[slot] >= G.legsToWin) {
      G.finished = true; G.winnerSlot = slot;
    } else {
      G.currentLeg++;
      G.cricket_state = initCricketState('cricket_fb_cezali', G.includeLow);
      G.starter = G.starter === 1 ? 2 : 1;
      G.currentTurn = G.starter;
    }
  } else {
    G.currentTurn = slot === 1 ? 2 : 1;
  }
  postVisit(slot);
}

// =====================================================================
// KARAMBOL HANDLERS
// =====================================================================
function karambolDart(target, mult) {
  if (!G || G.finished) return;
  if (karambolDarts.length >= 3) return;
  // H için visit başına 1 kez (3 ok = 1 H mark)
  if (target === 'H' && karambolDarts.some(d => d.target === 'H')) {
    toast('H bu visit\'te zaten kaydedildi');
    return;
  }
  karambolDarts.push({ target: target == null ? null : String(target), mult });
  if (karambolDarts.length === 3) submitKarambolDarts();
  else refresh();
}

function karambolUndoDart() {
  if (karambolDarts.length > 0) {
    karambolDarts.pop();
    refresh();
    return;
  }
  cricketConfirmAndUndoLastVisit();
}

async function submitKarambolDarts() {
  if (!G || G.finished) return;
  const slot = G.currentTurn;
  const pKey = `p${slot}`;
  const st = G.cricket_state;
  const targets = fbTargetsList(G.includeLow);
  saveUndoSnapshot();
  for (const d of karambolDarts) {
    if (d.target == null || d.mult <= 0) continue;
    if (!targets.map(String).includes(String(d.target))) continue;
    if (!st.marks[d.target]) st.marks[d.target] = { p1: 0, p2: 0 };
    const cur = st.marks[d.target][pKey] || 0;
    st.marks[d.target][pKey] = Math.min(3, cur + d.mult);
  }
  karambolDarts = [];
  // Win: all targets closed for this player
  const allClosed = targets.every(t => (st.marks[String(t)]?.[pKey] || 0) >= 3);
  if (allClosed) {
    G.legs[slot]++;
    if (G.legs[slot] >= G.legsToWin) {
      G.finished = true; G.winnerSlot = slot;
    } else {
      G.currentLeg++;
      G.cricket_state = initCricketState('cricket_fb_karambol', G.includeLow);
      G.starter = G.starter === 1 ? 2 : 1;
      G.currentTurn = G.starter;
    }
  } else {
    G.currentTurn = slot === 1 ? 2 : 1;
  }
  postVisit(slot);
}

// =====================================================================
// X01 HANDLERS
// =====================================================================
function x01AddDigit(ch) {
  if (!G || G.finished) return;
  if (submitLocked) return;
  if (currentInput.length >= 3) return;
  currentInput += ch;
  refresh();
}
function x01ClearInput() {
  currentInput = '';
  refresh();
}
function x01SetQuick(score) {
  if (!G || G.finished) return;
  if (submitLocked) return;
  currentInput = String(score);
  refresh();
}
async function x01Submit() {
  if (!G || G.finished) return;
  if (submitLocked) return;
  const score = +currentInput;
  if (isNaN(score) || score < 0 || score > 180) { x01ClearInput(); return; }
  currentInput = '';
  submitLocked = true;
  setTimeout(() => { submitLocked = false; }, 350);

  // Checkout tespiti: kalan skor tam tutuyorsa kaçıncı okta çıkıldığını sor
  let finishDarts = null;
  if (score > 0 && score === G.remaining[G.currentTurn]) {
    finishDarts = await askFinishDarts(score);
    if (finishDarts === null) {
      // İptal — skoru geri koy, submit etme
      currentInput = String(score);
      submitLocked = false;
      refresh();
      return;
    }
  }

  const slot = G.currentTurn;
  // Bust tespiti (recordX01Throw ile aynı kural) — flash etiketi için
  const remBefore = G.remaining[slot];
  const nr = remBefore - score;
  const bust = (nr < 0 || nr === 1);
  const legBefore = G.currentLeg;

  saveUndoSnapshot();
  recordX01Throw(slot, score, finishDarts);

  // Atış flash'ı — kaydedilen sayı ekran ortasında ~1 sn belirip soluyor (tıklamayı engellemez).
  // board.js ile birebir: leg/maç bittiyse zaten özet/sonuç açılıyor, çakışmasın diye flash gösterme.
  const legFinished = G.finished || G.currentLeg !== legBefore;
  if (!legFinished) showScoreFlash(bust ? 'Bust' : String(score), bust);

  refresh();
  if (G.finished) showResult();
}

// Atış flash modalı — board.js'ten birebir kopya (style.css .score-flash-modal kullanır).
// Tıklamayı engellemez (pointer-events: none), kendiliğinden silinir.
let _scoreFlashEl = null;
function showScoreFlash(text, isBust) {
  if (_scoreFlashEl) { _scoreFlashEl.remove(); _scoreFlashEl = null; }
  const el = document.createElement('div');
  el.className = 'score-flash-modal' + (isBust ? ' bust' : '');
  el.innerHTML = `<div class="score-flash-num">${text}</div>`;
  document.body.appendChild(el);
  _scoreFlashEl = el;
  void el.offsetWidth; // reflow → giriş animasyonu
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { if (el === _scoreFlashEl) _scoreFlashEl = null; el.remove(); }, 250);
  }, 800);
}
function askFinishDarts(score) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'finish-prompt';
    overlay.innerHTML = `
      <div class="finish-prompt-card">
        <div class="finish-prompt-title">Checkout: ${score}</div>
        <div class="finish-prompt-sub">Bitiren çift kaçıncı oktu?</div>
        <div class="finish-prompt-buttons">
          <button data-fd="1">1. ok</button>
          <button data-fd="2">2. ok</button>
          <button data-fd="3">3. ok</button>
        </div>
        <button class="finish-prompt-cancel">İptal</button>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler, true);
      resolve(val);
    };
    overlay.querySelectorAll('button[data-fd]').forEach(b => {
      b.onclick = () => close(+b.dataset.fd);
    });
    overlay.querySelector('.finish-prompt-cancel').onclick = () => close(null);
    const keyHandler = (e) => {
      if (e.key === '1' || e.key === '2' || e.key === '3') close(+e.key);
      else if (e.key === 'Escape') close(null);
    };
    document.addEventListener('keydown', keyHandler, true);
  });
}
function recordX01Throw(slot, score, finishDarts) {
  const cur = G.remaining[slot];
  let newRem = cur - score;
  let bust = false;
  if (newRem < 0 || newRem === 1) { bust = true; newRem = cur; }
  G.history.push({ slot, score, remaining: cur, bust, leg: G.currentLeg, finishDarts: finishDarts || null });
  G.totalScore[slot] += bust ? 0 : score;
  G.darts[slot] += (finishDarts && newRem === 0 && !bust) ? finishDarts : 3;
  G.turns[slot] += 1;
  if (!bust) G.remaining[slot] = newRem;
  if (newRem === 0 && !bust) {
    G.legs[slot] += 1;
    if (G.legs[slot] >= G.legsToWin) {
      G.finished = true; G.winnerSlot = slot;
    } else {
      const startScore = { '501': 501, '701': 701, '1001': 1001 }[G.mode] || 501;
      G.remaining[1] = startScore; G.remaining[2] = startScore;
      G.currentLeg += 1;
      G.starter = G.starter === 1 ? 2 : 1;
      G.currentTurn = G.starter;
    }
  } else {
    G.currentTurn = G.currentTurn === 1 ? 2 : 1;
  }
}
async function x01Undo() {
  if (!G) return;
  if (G.history.length > 0 && G.history[G.history.length - 1].leg === G.currentLeg) {
    if (!await scConfirm('Son atışı geri al?')) return;
    G.history.pop();
    rebuildX01FromHistory();
    refresh();
  } else if (G.undoSnapshot) {
    if (!await scConfirm('Önceki visit geri alınsın mı?')) return;
    restoreFromSnapshot();
    refresh();
  }
}
function rebuildX01FromHistory() {
  const startScore = { '501': 501, '701': 701, '1001': 1001 }[G.mode] || 501;
  const history = G.history.slice();
  G.legs = [0, 0, 0]; G.remaining = [0, startScore, startScore];
  G.totalScore = [0, 0, 0]; G.darts = [0, 0, 0]; G.turns = [0, 0, 0];
  G.finished = false; G.winnerSlot = null;
  G.currentTurn = G.starter; G.currentLeg = 1; G.history = [];
  for (const h of history) {
    recordX01Throw(h.slot, h.score, h.finishDarts);
    if (G.finished) break;
  }
}

// =====================================================================
// COMMON: undo snapshot (cricket variants)
// =====================================================================
function saveUndoSnapshot() {
  G.undoSnapshot = {
    cricket_state: G.cricket_state ? JSON.parse(JSON.stringify(G.cricket_state)) : null,
    currentTurn: G.currentTurn,
    legs: [...G.legs],
    currentLeg: G.currentLeg,
    starter: G.starter,
    finished: G.finished,
    winnerSlot: G.winnerSlot,
    remaining: [...G.remaining],
    history: G.history.slice(),
    totalScore: [...G.totalScore],
    darts: [...G.darts],
    turns: [...G.turns],
  };
}

function restoreFromSnapshot() {
  const s = G.undoSnapshot;
  if (!s) return;
  G.cricket_state = s.cricket_state;
  G.currentTurn = s.currentTurn;
  G.legs = s.legs;
  G.currentLeg = s.currentLeg;
  G.starter = s.starter;
  G.finished = s.finished;
  G.winnerSlot = s.winnerSlot;
  G.remaining = s.remaining;
  G.history = s.history;
  G.totalScore = s.totalScore;
  G.darts = s.darts;
  G.turns = s.turns;
  G.undoSnapshot = null;
  cricketDarts = []; fbDarts = []; karambolDarts = [];
  fbMetaMode = null; fbMetaScore = 0;
}

async function cricketConfirmAndUndoLastVisit() {
  if (!G || !G.undoSnapshot) { toast('Geri alınacak visit yok'); return; }
  if (!await scConfirm('Önceki visit geri alınsın mı?')) return;
  restoreFromSnapshot();
  refresh();
}

function postVisit(slot) {
  if (G.finished) showResult();
  else refresh();
}

// =====================================================================
// CONFIRM MODAL
// =====================================================================
function scConfirm(msg) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'sc-confirm-overlay';
    overlay.innerHTML = `
      <div class="sc-confirm-box">
        <p>${msg}</p>
        <div class="sc-confirm-btns">
          <button class="btn secondary" id="sc-cancel">İptal</button>
          <button class="btn" id="sc-ok" style="background:var(--accent);color:#fff;">Evet</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = (v) => { overlay.remove(); resolve(v); };
    overlay.querySelector('#sc-ok').onclick = () => close(true);
    overlay.querySelector('#sc-cancel').onclick = () => close(false);
  });
}

// =====================================================================
// RESULT SCREEN
// =====================================================================
async function forceFinish() {
  if (!G || G.finished) return;
  const e1 = G.players[1], e2 = G.players[2];
  // Önce onay al
  const confirmed = await new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'finish-prompt';
    ov.innerHTML = `
      <div class="finish-prompt-card">
        <div class="finish-prompt-title">Maçı Bitir</div>
        <div class="finish-prompt-sub">Kim kazandı?</div>
        <div class="finish-prompt-buttons">
          <button data-w="1">${e1}</button>
          <button data-w="2">${e2}</button>
        </div>
        <button class="finish-prompt-cancel">İptal</button>
      </div>`;
    document.body.appendChild(ov);
    const close = val => { ov.remove(); document.removeEventListener('keydown', kh, true); resolve(val); };
    ov.querySelectorAll('button[data-w]').forEach(b => b.onclick = () => close(+b.dataset.w));
    ov.querySelector('.finish-prompt-cancel').onclick = () => close(null);
    const kh = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', kh, true);
  });
  if (confirmed === null) return;
  G.finished = true;
  G.winnerSlot = confirmed;
  G.legs[confirmed] = Math.max(G.legs[confirmed], G.legs[confirmed === 1 ? 2 : 1] + 1);
  showResult();
}

function showResult() {
  root.style.display = 'none';
  const rp = document.getElementById('result-panel');
  rp.style.display = 'flex';

  const ws = G.winnerSlot;
  const ls = ws === 1 ? 2 : 1;

  // G.history'den her oyuncu için istatistik hesapla
  function calcStats(slot) {
    const throws = G.history.filter(h => h.slot === slot && !h.bust);
    const allThrows = G.history.filter(h => h.slot === slot);
    const oneEighties = throws.filter(h => h.score === 180).length;
    const oneFourtyPlus = throws.filter(h => h.score >= 140 && h.score < 180).length;
    const oneHundredPlus = throws.filter(h => h.score >= 100 && h.score < 140).length;
    const highTurn = throws.reduce((mx, h) => Math.max(mx, h.score), 0);
    const checkouts = throws.filter(h => h.score === h.remaining);
    const bestCheckout = checkouts.reduce((mx, h) => Math.max(mx, h.score), 0);
    const avg3 = G.darts[slot] > 0 ? (G.totalScore[slot] / G.darts[slot]) * 3 : 0;
    return { oneEighties, oneFourtyPlus, oneHundredPlus, highTurn, bestCheckout, avg3 };
  }

  const wSt = calcStats(ws);
  const lSt = calcStats(ls);

  function statCard(slot, isWinner) {
    const st = isWinner ? wSt : lSt;
    const name = G.players[slot];
    const legs = G.legs[slot];
    const border = isWinner ? '2px solid #22c55e' : '2px solid var(--surface-3,#2a2f3a)';
    const bg = isWinner ? 'linear-gradient(180deg,rgba(34,197,94,0.15),rgba(34,197,94,0.04))' : 'var(--surface-2)';
    const badge = isWinner ? `<div style="font-size:clamp(10px,2.5vmin,13px);color:#22c55e;font-weight:700;letter-spacing:0.18em;margin-bottom:0.35rem;">🏆 KAZANAN</div>` : '';
    return `
      <div style="background:${bg};border:${border};border-radius:14px;padding:clamp(12px,3vmin,22px);text-align:center;display:flex;flex-direction:column;gap:0.5rem;">
        ${badge}
        <div style="font-size:clamp(1.1rem,4vmin,1.9rem);font-weight:800;">${name}</div>
        <div style="font-size:clamp(0.8rem,2.5vmin,1rem);color:var(--text-dim);">${G.legs[ws]} – ${G.legs[ls]} leg</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vmin,12px);margin-top:0.5rem;font-variant-numeric:tabular-nums;">
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">3-Ok Ort.</div>
            <div style="font-size:clamp(1.2rem,4vmin,1.7rem);font-weight:800;">${st.avg3.toFixed(2)}</div>
          </div>
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">180</div>
            <div style="font-size:clamp(1.2rem,4vmin,1.7rem);font-weight:800;">${st.oneEighties}</div>
          </div>
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">Best CO</div>
            <div style="font-size:clamp(1.2rem,4vmin,1.7rem);font-weight:800;">${st.bestCheckout || '—'}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vmin,12px);font-variant-numeric:tabular-nums;">
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">140+</div>
            <div style="font-size:clamp(1rem,3.5vmin,1.4rem);font-weight:700;">${st.oneFourtyPlus}</div>
          </div>
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">100+</div>
            <div style="font-size:clamp(1rem,3.5vmin,1.4rem);font-weight:700;">${st.oneHundredPlus}</div>
          </div>
          <div>
            <div style="font-size:clamp(8px,2vmin,11px);color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">High Turn</div>
            <div style="font-size:clamp(1rem,3.5vmin,1.4rem);font-weight:700;">${st.highTurn || '—'}</div>
          </div>
        </div>
      </div>`;
  }

  rp.innerHTML = `
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vmin,20px);padding:clamp(12px,3vmin,24px);overflow-y:auto;box-sizing:border-box;">
      <div style="text-align:center;">
        <div style="font-size:clamp(10px,2.5vmin,13px);color:var(--text-dim);text-transform:uppercase;letter-spacing:0.15em;">Maç Sonucu</div>
        <div style="font-size:clamp(1rem,3.5vmin,1.5rem);font-weight:800;margin-top:0.2rem;">${G.mode.toUpperCase()} · Bo${G.legsToWin * 2 - 1}</div>
      </div>
      <div style="width:100%;max-width:820px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vmin,16px);">
        ${statCard(ws, true)}
        ${statCard(ls, false)}
      </div>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem;flex-wrap:wrap;justify-content:center;">
        <button class="btn primary" onclick="resetGame()">Yeni Oyun</button>
        <a href="/" class="btn secondary">Ana Sayfa</a>
      </div>
    </div>
  `;
}

// =====================================================================
// KEYBOARD (X01 only)
// =====================================================================
document.addEventListener('keydown', (e) => {
  if (!G || G.finished) return;
  if (G.mode !== '501' && G.mode !== '701' && G.mode !== '1001') return;
  if (e.key >= '0' && e.key <= '9') x01AddDigit(e.key);
  else if (e.key === 'Backspace') { currentInput = currentInput.slice(0, -1); refresh(); }
  else if (e.key === 'Enter') x01Submit();
  else if (e.key === 'Escape') x01ClearInput();
});

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
