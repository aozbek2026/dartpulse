<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Şifremi Unuttum — Dart Core Pro</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0b0d14; }
  .card { background: #12152a; border: 1px solid #1e2336; border-radius: 18px; padding: 2.5rem 2rem; max-width: 420px; width: 90%; }
  h2 { margin: 0 0 0.25rem; font-size: 1.4rem; text-align: center; }
  .sub { color: #8892b0; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
  label { display: block; color: #8892b0; font-size: 0.85rem; margin-bottom: 0.35rem; }
  input { width: 100%; box-sizing: border-box; background: #1a1e30; border: 1px solid #2a2e45; border-radius: 10px; padding: 0.75rem 1rem; color: #fff; font-size: 1rem; margin-bottom: 1rem; }
  input:focus { outline: none; border-color: #ff3860; }
  .btn { width: 100%; background: linear-gradient(135deg,#ff3860,#c0392b); color: #fff; border: none; border-radius: 10px; padding: 0.85rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .error { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
  .success { background: #0d2b1a; border: 1px solid #1a4a2a; border-radius: 10px; padding: 1rem; color: #4ade80; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  a.back { display: block; text-align: center; margin-top: 1rem; color: #8892b0; font-size: 0.85rem; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Şifremi Unuttum</h2>
  <p class="sub">E-posta adresinize sıfırlama linki göndereceğiz</p>
  <div class="error" id="err"></div>
  <div class="success" id="ok">✓ Kayıtlı e-postanıza sıfırlama linki gönderildi. Spam klasörünü de kontrol edin.</div>
  <label>E-posta Adresiniz</label>
  <input type="email" id="email" placeholder="ornek@dart.com" />
  <button class="btn" onclick="submit()">Sıfırlama Linki Gönder</button>
  <a href="/login.html" class="back">← Giriş sayfasına dön</a>
</div>
<script>
async function submit() {
  const email = document.getElementById('email').value.trim();
  document.getElementById('err').style.display = 'none';
  if (!email) { showErr('E-posta adresi girin'); return; }
  const r = await fetch('/auth/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });
  const d = await r.json();
  if (r.ok) {
    document.getElementById('ok').style.display = 'block';
    document.querySelector('.btn').disabled = true;
  } else {
    showErr(d.error || 'Bir hata oluştu');
  }
}
function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
